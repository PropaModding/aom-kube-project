# Headless AoM pod: no /dev/dri, no host X11, no PulseAudio. Xvfb + optional
# VNC are self-contained (see dockerfile.k8s + entrypoint.sh); this is what
# validates the image will actually run on a GPU-less cloud node pool (AKS
# included) rather than quietly depending on hardware only present on a dev
# box.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aom-headless
  labels:
    app: aom-headless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aom-headless
  template:
    metadata:
      labels:
        app: aom-headless
    spec:
      # Host network so DirectPlay8's fixed ports (2299/2300) are reachable
      # straight on the minikube node's own IP — AoM's Direct Connect field
      # has no port entry, so a NodePort remap (which lands outside
      # 2299/2300 by default) wouldn't work without a proxy in front of it.
      # Only put one pod on hostNetwork per node: a second hostNetwork pod
      # on the same node would collide on these same ports.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: aom
          image: aom-k8s:latest
          imagePullPolicy: Never # image is loaded straight into the node, not pulled from a registry
          # No `command:` here deliberately: setting it would replace the
          # image's ENTRYPOINT (tini -- entrypoint.sh, which starts Xvfb)
          # rather than just its CMD, and wine would launch with no X
          # server to talk to. `args` alone overrides CMD only.
          args: ["wine", "aomxnocd1.exe", "xres=800", "yres=600", "NoIntroCinematics", "window"]
          env:
            - name: ENABLE_VNC
              value: "1"
          ports:
            - name: vnc
              containerPort: 5900
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: aom-headless-vnc
spec:
  selector:
    app: aom-headless
  ports:
    - name: vnc
      port: 5900
      targetPort: 5900
  type: ClusterIP
