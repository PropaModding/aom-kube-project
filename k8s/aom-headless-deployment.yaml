# Headless AoM pod: no /dev/dri, no host X11, no PulseAudio. Xvfb + optional
# VNC are self-contained (see dockerfile.k8s + entrypoint.sh); this is what
# validates the image will actually run on a GPU-less cloud node pool (AKS
# included) rather than quietly depending on hardware only present on a dev
# box.
#
# N-host update (2026-08-13): `replicas` is now the actual "how many hosts"
# knob - `kubectl scale deployment/aom-headless --replicas=N` is the entire
# operation for adding/removing hosts, no other manifest or lobby change
# needed. This only works because aom-lobby now discovers backend pods
# dynamically via the Kubernetes API (lobby/main.go's podLister, granted
# read-only pod list/watch access by k8s/lobby-rbac.yaml) instead of being
# told about a fixed address through static config - see
# lobby/packet-handling-design.md's "N-host round-robin matchmaking"
# section. Each replica already gets its own pod IP from the cluster
# network for free; that's what made per-host duplication of this whole
# file unnecessary once aom-lobby stopped needing to be told addresses
# upfront.
#
# Every pod also hosts *itself* into a joinable lobby on startup now
# (auto-host.sh, backgrounded by entrypoint.sh alongside input-agent) -
# no external `host-game-kube.sh` run needed either. Scaling up really is
# just the one `kubectl scale` command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aom-headless
  labels:
    app: aom-headless
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aom-headless
  template:
    metadata:
      labels:
        app: aom-headless
    spec:
      # No hostNetwork here: the node's real 2299/2300 belong to
      # aom-lobby (see k8s/lobby-deployment.yaml), which sits in front of
      # every aom-headless pod and rewrites/relays traffic to whichever
      # one a given client was matched to. This pod only needs a normal,
      # in-cluster pod IP - aom-lobby finds it via the Kubernetes API
      # (see this file's own top comment), not a Service. No Service is
      # defined for the game ports or VNC here anymore - a ClusterIP
      # Service load-balances per-connection across every replica behind
      # it, which is actively wrong once there's more than one pod:
      # aom-lobby needs to address a *specific* pod, not "one of them,
      # whichever". For VNC access to a specific pod (e.g. re-calibrating
      # coordinates, or watching host-game-kube.sh drive a manual re-host
      # - see docs/host-flow.md), port-forward the pod directly:
      #   kubectl port-forward pod/<name> 5901:5900
      containers:
        - name: aom
          image: aom-k8s:latest
          imagePullPolicy: Never # image is loaded straight into the node, not pulled from a registry
          # No `command:` here deliberately: setting it would replace the
          # image's ENTRYPOINT (tini -- entrypoint.sh, which starts Xvfb)
          # rather than just its CMD, and wine would launch with no X
          # server to talk to. `args` alone overrides CMD only.
          args: ["wine", "aomxnocd1.exe", "xres=800", "yres=600", "NoIntroCinematics", "window"]
          env:
            - name: ENABLE_VNC
              value: "1"
            # Both needed by healthcheck.sh (this Deployment's own
            # livenessProbe.exec target, see docs/host-health-probe-design.md)
            # to ask the right node-local host-health-agent about the
            # right pod - neither is known until the pod is actually
            # scheduled, hence the downward API rather than a literal
            # value.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Diagnostic pass, 2026-08-12 (see lobby/packet-handling-design.md's
            # "what changes I'd make" discussion): entrypoint.sh's final
            # `exec "$@"` inherits this like any other env var, and Wine
            # reads WINEDEBUG directly - no entrypoint.sh changes needed.
            # stderr goes straight to `kubectl logs`, same as any other
            # container.
            #
            # Correction (2026-08-12, same session): tried +relay here
            # first, matching run-aom-spoofed-client.sh's
            # FULL_RELAY_TRACE option - wrong call. On the actual host
            # process (talking to two clients simultaneously, far busier
            # than a single test client ever is) it produced ~10,000 log
            # lines/second and completely saturated the pod - it stopped
            # answering discovery queries at all within seconds, `/hosts`
            # went to 0, real client Direct-Connects would have hung on
            # nothing. Reverted to the same lighter channel set the test
            # clients use without FULL_RELAY_TRACE. If the socket-level
            # question this was meant to answer (does the host's
            # newPeerBroadcast send use a different local port than
            # ordinary reply traffic?) still needs answering, +relay
            # needs a narrower net.dll-only channel or a live strace
            # instead of blanket Win32 call tracing - not this.
            - name: WINEDEBUG
              value: "+timestamp,+dpwsockx,+dplay,+dplaysvc,+dpnet,+winsock,+ws2_32"
          ports:
            - name: vnc
              containerPort: 5900
            - name: dp8-discovery
              containerPort: 2299
              protocol: UDP
            - name: dp8-session
              containerPort: 2300
              protocol: UDP
            - name: input-agent
              containerPort: 8082
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # Detects a silently-stuck auto-host.sh run (misclicks onto the
          # wrong menu screen but still exits 0 - see CLAUDE.md's top
          # todo and docs/host-health-probe-design.md for the full
          # design/evidence) by asking this node's host-health-agent
          # (k8s/host-health-agent-daemonset.yaml) whether this specific
          # pod has actually reached a hosted, discoverable state.
          #
          # initialDelaySeconds is generous (100s) because auto-host.sh's
          # own sequence "takes well over a minute" per CLAUDE.md - firing
          # any earlier would restart pods that were still mid-sequence,
          # not actually stuck. failureThreshold (3) at periodSeconds
          # (10s) rides out hostProbe's own documented single-cycle
          # false-negative window (a host added within the last
          # podPollInterval briefly reads not-live - see hostLive's own
          # doc comment in lobby/main.go) several times over, so this
          # only ever trips for a pod that never reaches the hosted state
          # at all, not one merely slow to report it the first time.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/healthcheck.sh"]
            initialDelaySeconds: 100
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
