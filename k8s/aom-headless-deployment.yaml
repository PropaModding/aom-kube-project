# Headless AoM pod: no /dev/dri, no host X11, no PulseAudio. Xvfb + optional
# VNC are self-contained (see dockerfile.k8s + entrypoint.sh); this is what
# validates the image will actually run on a GPU-less cloud node pool (AKS
# included) rather than quietly depending on hardware only present on a dev
# box.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aom-headless
  labels:
    app: aom-headless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aom-headless
  template:
    metadata:
      labels:
        app: aom-headless
    spec:
      # No hostNetwork here anymore: the node's real 2299/2300 now belong to
      # aom-lobby and quilkin (see k8s/lobby-deployment.yaml and
      # k8s/quilkin-deployment.yaml), which sit in front of this pod and
      # rewrite/relay traffic to it via the aom-headless-game Service below.
      # This pod only needs a normal, in-cluster pod IP.
      containers:
        - name: aom
          image: aom-k8s:latest
          imagePullPolicy: Never # image is loaded straight into the node, not pulled from a registry
          # No `command:` here deliberately: setting it would replace the
          # image's ENTRYPOINT (tini -- entrypoint.sh, which starts Xvfb)
          # rather than just its CMD, and wine would launch with no X
          # server to talk to. `args` alone overrides CMD only.
          args: ["wine", "aomxnocd1.exe", "xres=800", "yres=600", "NoIntroCinematics", "window"]
          env:
            - name: ENABLE_VNC
              value: "1"
          ports:
            - name: vnc
              containerPort: 5900
            - name: dp8-discovery
              containerPort: 2299
              protocol: UDP
            - name: dp8-session
              containerPort: 2300
              protocol: UDP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: aom-headless-vnc
spec:
  selector:
    app: aom-headless
  ports:
    - name: vnc
      port: 5900
      targetPort: 5900
  type: ClusterIP
---
# Stable in-cluster address for the real pod's DirectPlay8 ports, so
# aom-lobby and quilkin don't have to chase pod IPs across restarts.
apiVersion: v1
kind: Service
metadata:
  name: aom-headless-game
spec:
  selector:
    app: aom-headless
  ports:
    - name: dp8-discovery
      port: 2299
      targetPort: 2299
      protocol: UDP
    - name: dp8-session
      port: 2300
      targetPort: 2300
      protocol: UDP
  type: ClusterIP
