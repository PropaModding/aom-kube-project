# Headless AoM pod: no /dev/dri, no host X11, no PulseAudio. Xvfb + optional
# VNC are self-contained (see dockerfile.k8s + entrypoint.sh); this is what
# validates the image will actually run on a GPU-less cloud node pool (AKS
# included) rather than quietly depending on hardware only present on a dev
# box.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aom-headless
  labels:
    app: aom-headless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aom-headless
  template:
    metadata:
      labels:
        app: aom-headless
    spec:
      # No hostNetwork here anymore: the node's real 2299/2300 now belong to
      # aom-lobby (see k8s/lobby-deployment.yaml), which sits in front of
      # this pod and rewrites/relays traffic to it via the
      # aom-headless-game Service below. This pod only needs a normal,
      # in-cluster pod IP.
      containers:
        - name: aom
          image: aom-k8s:latest
          imagePullPolicy: Never # image is loaded straight into the node, not pulled from a registry
          # No `command:` here deliberately: setting it would replace the
          # image's ENTRYPOINT (tini -- entrypoint.sh, which starts Xvfb)
          # rather than just its CMD, and wine would launch with no X
          # server to talk to. `args` alone overrides CMD only.
          args: ["wine", "aomxnocd1.exe", "xres=800", "yres=600", "NoIntroCinematics", "window"]
          env:
            - name: ENABLE_VNC
              value: "1"
            # Diagnostic pass, 2026-08-12 (see lobby/packet-handling-design.md's
            # "what changes I'd make" discussion): entrypoint.sh's final
            # `exec "$@"` inherits this like any other env var, and Wine
            # reads WINEDEBUG directly - no entrypoint.sh changes needed.
            # stderr goes straight to `kubectl logs`, same as any other
            # container.
            #
            # Correction (2026-08-12, same session): tried +relay here
            # first, matching run-aom-spoofed-client.sh's
            # FULL_RELAY_TRACE option - wrong call. On the actual host
            # process (talking to two clients simultaneously, far busier
            # than a single test client ever is) it produced ~10,000 log
            # lines/second and completely saturated the pod - it stopped
            # answering discovery queries at all within seconds, `/hosts`
            # went to 0, real client Direct-Connects would have hung on
            # nothing. Reverted to the same lighter channel set the test
            # clients use without FULL_RELAY_TRACE. If the socket-level
            # question this was meant to answer (does the host's
            # newPeerBroadcast send use a different local port than
            # ordinary reply traffic?) still needs answering, +relay
            # needs a narrower net.dll-only channel or a live strace
            # instead of blanket Win32 call tracing - not this.
            - name: WINEDEBUG
              value: "+timestamp,+dpwsockx,+dplay,+dplaysvc,+dpnet,+winsock,+ws2_32"
          ports:
            - name: vnc
              containerPort: 5900
            - name: dp8-discovery
              containerPort: 2299
              protocol: UDP
            - name: dp8-session
              containerPort: 2300
              protocol: UDP
            - name: input-agent
              containerPort: 8082
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: aom-headless-vnc
spec:
  selector:
    app: aom-headless
  ports:
    - name: vnc
      port: 5900
      targetPort: 5900
  type: ClusterIP
---
# Stable in-cluster address for the real pod's DirectPlay8 ports, so
# aom-lobby doesn't have to chase pod IPs across restarts. Also carries
# input-agent's TCP port: unlike SESSION_BACKEND_ADDR (deliberately
# pinned to the pod's raw IP - see deploy-minikube.sh - since the session
# proxy's backend-initiated-relay logic matches on that traffic's real
# source address), aom-lobby's calls to input-agent are plain client-
# initiated HTTP requests with no such constraint, so there's no reason
# not to use this Service's stable DNS name instead of chasing the pod IP
# the same way SESSION_BACKEND_ADDR has to.
apiVersion: v1
kind: Service
metadata:
  name: aom-headless-game
spec:
  selector:
    app: aom-headless
  ports:
    - name: dp8-discovery
      port: 2299
      targetPort: 2299
      protocol: UDP
    - name: dp8-session
      port: 2300
      targetPort: 2300
      protocol: UDP
    - name: input-agent
      port: 8082
      targetPort: 8082
      protocol: TCP
  type: ClusterIP
