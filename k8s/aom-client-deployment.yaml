# Second AoM pod, meant to run alongside aom-headless so the two can be
# used the same way run-aom-head.sh + run-aom-client.sh were on a single
# Docker host: one hosts, the other joins/browses so DirectPlay8 discovery
# traffic actually gets generated (a lone host never transmits anything on
# its own, see docs/directplay8-protocol.md). Same image as the host pod —
# only the launch args and labels differ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aom-client
  labels:
    app: aom-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aom-client
  template:
    metadata:
      labels:
        app: aom-client
    spec:
      containers:
        - name: aom
          image: aom-k8s:latest
          imagePullPolicy: Never # image is loaded straight into the node, not pulled from a registry
          # No `command:` here deliberately: setting it would replace the
          # image's ENTRYPOINT (tini -- entrypoint.sh, which starts Xvfb)
          # rather than just its CMD, and wine would launch with no X
          # server to talk to. `args` alone overrides CMD only.
          args: ["wine", "aomxnocd1.exe", "xres=1024", "yres=768", "NoIntroCinematics"]
          env:
            - name: ENABLE_VNC
              value: "1"
          ports:
            - name: vnc
              containerPort: 5900
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: aom-client-vnc
spec:
  selector:
    app: aom-client
  ports:
    - name: vnc
      port: 5900
      targetPort: 5900
  type: ClusterIP
